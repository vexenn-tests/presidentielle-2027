<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Présidentielle 2027 – Les candidats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--muted:#5a5a5a;--line:#e3e3e0;--soft:#f1f1ef;--ok:#1b6b37;--okbg:#e3f3e8;--link:#1d4ed8}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 28px}
.count{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:15px;color:#4a4a4a;margin:0 0 16px}
.count .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.count strong{color:var(--ink)}
.search{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:14px;padding:0 8px 0 16px;height:56px;margin-bottom:14px;background:#fff}
.search:focus-within{box-shadow:0 0 0 3px rgba(29,78,216,.25)}
.search input{flex:1 1 auto;min-width:0;border:0;outline:none;font:inherit;font-size:17px;color:var(--ink);background:transparent;height:100%}
.search input::-webkit-search-cancel-button{display:none}
.clear{width:40px;height:40px;border-radius:50%;border:0;background:#ececea;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 40px}
.clear[hidden]{display:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid #d8d8d3;background:#fff;color:var(--ink);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip:disabled{opacity:.4;cursor:default}
.chip .n{opacity:.7;margin-left:4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;padding:9px 4px;margin-left:auto;cursor:pointer;min-height:40px}
.toggle input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.status{font-size:14px;color:#4a4a4a;margin:4px 0 12px;min-height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card.ret{background:#f9f9f7;opacity:.72}
.id{display:flex;align-items:center;gap:14px}
.av{width:64px;height:64px;border-radius:50%;flex:0 0 64px;color:#fff;font-family:Archivo,sans-serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.av{position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
.ret .av{filter:grayscale(1)}
.nm{font-family:Archivo,sans-serif;font-size:18px;font-weight:700;margin:0;line-height:1.2}
.pt{font-size:13px;color:var(--muted);margin:2px 0 0}
.pt strong{font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--soft);color:#3a3a3a;display:inline-flex;align-items:center;gap:6px}
.tag.st{background:var(--okbg);color:var(--ok)}
.tag.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ret .tag.st{background:#e6e6e2;color:#4a4a4a}
.bio{margin:0;font-size:14px;line-height:1.5;color:#2b2b2b}
.foot{margin-top:auto;border-top:1px solid #ececea;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.foot a{font-size:14px;font-weight:600;color:var(--link);display:inline-flex;align-items:center;gap:6px;min-height:32px;text-decoration:none}
.foot a:hover{text-decoration:underline}
.credit{font-size:11px;color:#8a8a8a}
.empty{background:#fff;border:1px dashed #cfcfcb;border-radius:16px;padding:32px;text-align:center;font-size:15px;color:#4a4a4a}
.note{font-size:12px;color:#777;margin-top:18px}
@media (max-width:560px){.toggle{margin-left:0}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <p class="count" id="count"><span class="dot"></span><span>Chargement des candidats…</span></p>

  <label class="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input id="q" type="search" autocomplete="off" placeholder="Rechercher un candidat ou un parti" aria-label="Rechercher un candidat ou un parti">
    <button class="clear" id="clear" type="button" aria-label="Effacer la recherche" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </label>

  <div class="filters" id="filters" role="group" aria-label="Filtrer par famille politique"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <p class="note">Familles politiques selon la classification du ministère de l'Intérieur.</p>
</div>

<script>
(function () {
/* ================== RÉGLAGES ==================
   Les données viennent du Google Sheet ci-dessous.
   Pour utiliser un autre tableau, remplacez juste l'identifiant. */
var SHEET_ID = "1XsO9xCC7wN6albneqI4TEru2L0o_sKXzCUlX7csBSl4";
var SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&headers=1";

/* Couleur par parti (le nom doit correspondre à la colonne « parti »).
   Un parti absent de cette liste s'affiche en gris. */
var COULEURS = {
  "la france insoumise": "#c4213c",
  "parti communiste français": "#7f1d1d",
  "parti socialiste": "#be185d",
  "les ecologistes": "#15803d",
  "place publique": "#7e22ce",
  "renaissance": "#a16207",
  "horizons": "#0e7490",
  "les républicains": "#1d4ed8",
  "rassemblement national": "#1e1b4b"
};
var GRIS = "#4b5563";
var FAMILLES = ["Extrême gauche", "Gauche", "Centre", "Droite", "Extrême droite", "Divers"];
/* ============================================== */

var st = { q: "", fam: null, ret: true };
var CANDS = [], MAJ = "";
var $ = function (id) { return document.getElementById(id); };

function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "'").trim(); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function ini(n) { return n.split(/[\s-]+/).filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase(); }
function lastName(n) { var p = n.trim().split(/\s+/); return norm(p.length > 1 ? p.slice(1).join(" ") : n); }
function color(parti) {
  var k = norm(parti);
  for (var p in COULEURS) if (norm(p) === k) return COULEURS[p];
  return GRIS;
}
function safeUrl(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) || /^[\w./-]+\.(jpe?g|png|webp|gif)$/i.test(u) ? u : ""; }

/* Lecture CSV (gère les guillemets et les virgules dans les bios) */
function parseCSV(text) {
  var rows = [], row = [], f = "", q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function load(rows) {
  var head = rows.shift().map(norm);
  var col = function (name) { return head.indexOf(name); };
  var I = { nom: col("nom"), age: col("age"), parti: col("parti"), fam: col("famille"), st: col("statut"), bio: col("bio"), lien: col("lien_actu"), photo: col("photo"), credit: col("credit_photo"), maj: col("mise_a_jour") };
  var get = function (r, k) { return I[k] > -1 ? (r[I[k]] || "").trim() : ""; };
  CANDS = [];
  rows.forEach(function (r) {
    var nom = get(r, "nom");
    if (!nom) return;
    if (!MAJ && get(r, "maj")) MAJ = get(r, "maj");
    var fam = get(r, "fam");
    var famOk = FAMILLES.filter(function (f) { return norm(f) === norm(fam); })[0] || "Divers";
    var ret = norm(get(r, "st")).indexOf("retir") === 0;
    var age = parseInt(get(r, "age"), 10);
    CANDS.push({
      nom: nom, age: isNaN(age) ? "" : age + " ans", parti: get(r, "parti"), fam: famOk, ret: ret,
      bio: get(r, "bio"), lien: safeUrl(get(r, "lien")), photo: safeUrl(get(r, "photo")), credit: get(r, "credit"),
      c: color(get(r, "parti")), key: norm(nom + " " + get(r, "parti") + " " + famOk)
    });
  });
  CANDS.sort(function (a, b) { return (a.ret - b.ret) || lastName(a.nom).localeCompare(lastName(b.nom), "fr"); });
  render();
}

function matches(c) { return !st.q || c.key.indexOf(norm(st.q)) > -1; }

function render() {
  var enLice = CANDS.filter(function (c) { return !c.ret; }).length;
  var nRet = CANDS.length - enLice;
  $("count").innerHTML = '<span class="dot"></span><strong>' + enLice + " candidats en lice</strong>" + (MAJ ? '<span>· mis à jour le ' + esc(MAJ) + "</span>" : "");

  var pool = CANDS.filter(function (c) { return (st.ret || !c.ret) && matches(c); });
  var counts = {}; pool.forEach(function (c) { counts[c.fam] = (counts[c.fam] || 0) + 1; });

  var chips = '<button class="chip" type="button" data-f="" aria-pressed="' + !st.fam + '">Tous<span class="n">' + pool.length + "</span></button>";
  FAMILLES.forEach(function (f) {
    var n = counts[f] || 0, on = st.fam === f;
    chips += '<button class="chip" type="button" data-f="' + esc(f) + '" aria-pressed="' + on + '"' + (n || on ? "" : " disabled") + ">" + esc(f) + '<span class="n">' + n + "</span></button>";
  });
  chips += '<label class="toggle"><input type="checkbox" id="ret"' + (st.ret ? " checked" : "") + "> Afficher les retraits (" + nRet + ")</label>";
  $("filters").innerHTML = chips;
  $("ret").addEventListener("change", function (e) { st.ret = e.target.checked; render(); });

  var list = pool.filter(function (c) { return !st.fam || c.fam === st.fam; });
  $("status").textContent = st.q ? list.length + " résultat" + (list.length > 1 ? "s" : "") + " pour « " + st.q + " »" : "";
  $("clear").hidden = !st.q;

  $("grid").innerHTML = list.length ? list.map(card).join("") :
    '<div class="empty" style="grid-column:1/-1">Aucun candidat ne correspond à « ' + esc(st.q) + " ».</div>";
  size();
}

function card(c) {
  var av = esc(ini(c.nom)) + (c.photo ? '<img src="' + esc(c.photo) + '" alt="Photo de ' + esc(c.nom) + '" loading="lazy" onerror="this.remove()">' : "");
  var foot = "";
  if (c.lien || c.credit) {
    foot = '<div class="foot">' +
      (c.lien ? '<a href="' + esc(c.lien) + '" target="_top">Suivre l\'actu de ' + esc(c.nom) + ' <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>' : "<span></span>") +
      (c.credit ? '<span class="credit">Photo : ' + esc(c.credit) + "</span>" : "") + "</div>";
  }
  return '<article class="card' + (c.ret ? " ret" : "") + '">' +
    '<div class="id"><div class="av" style="background:' + c.c + '">' + av + "</div>" +
    '<div><p class="nm">' + esc(c.nom) + '</p><p class="pt"><strong style="color:' + (c.ret ? "#5a5a5a" : c.c) + '">' + esc(c.parti) + "</strong>" + (c.age ? " · " + esc(c.age) : "") + "</p></div></div>" +
    '<div class="tags"><span class="tag">' + esc(c.fam) + '</span><span class="tag st">' + (c.ret ? "Retiré" : "En lice") + "</span></div>" +
    (c.bio ? '<p class="bio">' + esc(c.bio) + "</p>" : "") + foot + "</article>";
}

$("filters").addEventListener("click", function (e) {
  var b = e.target.closest(".chip"); if (!b || b.disabled) return;
  var f = b.getAttribute("data-f"); st.fam = f && st.fam !== f ? f : null; render();
});
$("q").addEventListener("input", function (e) { st.q = e.target.value.trim(); render(); });
$("clear").addEventListener("click", function () { st.q = ""; $("q").value = ""; $("q").focus(); render(); });

/* Hauteur automatique quand la page est intégrée en iframe */
function size() {
  try {
    if (window.parent === window) return;
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({ type: "trombi-2027-height", height: h }, "*");
    window.parent.postMessage({ sentinel: "amp", type: "embed-size", height: h }, "*");
  } catch (e) {}
}
window.addEventListener("resize", size);

fetch(SHEET_URL, { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (t) { if (/^\s*</.test(t)) throw new Error("not csv"); load(parseCSV(t)); })
  .catch(function () {
    $("count").innerHTML = '<span class="dot" style="background:#b91c1c"></span><span>Impossible de charger la liste des candidats pour le moment.</span>';
  });
})();
</script>
</body>
</html>
